# Servidor: copia este fichero y .env.example (como .env) a una carpeta, pon LITELLM_API_KEY y ejecuta
#   docker compose up -d
# El Watchtower que ya corre en el servidor debe incluir `demo-euipo` en su lista de contenedores
# (ver README). Aquí no se arranca otro Watchtower.
services:
  demo:
    container_name: demo-euipo
    image: ghcr.io/gplsi/demo-euipo:latest
    pull_policy: always
    ports:
      - "${PUERTO:-4545}:8000"
    env_file:
      - .env
    volumes:
      - ${TEST_JSONL:-../test.jsonl}:/srv/test.jsonl:ro
      - ${PREDICCIONES_JSONL:-../predictions.jsonl}:/srv/predictions.jsonl:ro
    # Opciones extra de app.py, p. ej. "--usar-precalculadas"
    command: ${OPCIONES:-}
    restart: unless-stopped
