# Arranque: copia .env.example a .env, pon LITELLM_API_KEY y ejecuta `docker compose up --build`.
services:
  demo:
    build: .
    image: demo-euipo
    ports:
      - "${PUERTO:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ${TEST_JSONL:-../test.jsonl}:/srv/test.jsonl:ro
      - ${PREDICCIONES_JSONL:-../predictions.jsonl}:/srv/predictions.jsonl:ro
    # Opciones extra de app.py, p. ej. "--usar-precalculadas"
    command: ${OPCIONES:-}
    restart: unless-stopped
